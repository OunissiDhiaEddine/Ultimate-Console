[package]
name = "uc-agent"
description = "Ultimate Console background agent: hotkeys, orchestrator, overlay host, IPC server (WP-08)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
uc-core.workspace = true
uc-display.workspace = true
uc-tv.workspace = true
uc-shell.workspace = true
uc-power.workspace = true
uc-audio.workspace = true
uc-sysinfo.workspace = true
uc-overlay.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Recovery",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
