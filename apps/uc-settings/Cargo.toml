[package]
name = "uc-settings"
description = "Ultimate Console settings app (egui, talks to the agent over a named pipe) (WP-09)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
uc-core.workspace = true
uc-update.workspace = true
eframe.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# Direct3D 12 renderer: DXGI flip-model presents pace properly at 165 Hz and
# with monitors of different refresh rates, which OpenGL on Windows doesn't.
# Only the dx12 backend, to keep the exe small; glow stays as the fallback.
eframe = { workspace = true, features = ["wgpu"] }
wgpu = { workspace = true, features = ["dx12", "wgsl", "std", "parking_lot"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

# Lets the app build and run its tests on Linux during development.
[target.'cfg(not(windows))'.dependencies]
eframe = { workspace = true, features = ["x11"] }

[lints]
workspace = true
