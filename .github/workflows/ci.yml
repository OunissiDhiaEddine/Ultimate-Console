name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: fmt · clippy · test · build (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel and components; this installs them.
      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --workspace --release --locked

      # Same pack as release.yml, so a packaging problem shows up on the PR
      # rather than at release time. Keep the vpk version in step with it.
      - name: Velopack pack (dry run)
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.3.39-g8d2844f
          New-Item -ItemType Directory -Force publish | Out-Null
          foreach ($exe in 'uc-agent', 'uc-settings', 'uc-probe') { Copy-Item "target/release/$exe.exe" publish/ }
          Copy-Item LICENSE, README.md publish/
          vpk pack --packId UltimateConsole --packVersion "0.0.0-ci.${{ github.run_number }}" `
            --packDir publish --mainExe uc-settings.exe --packTitle "Ultimate Console" `
            --packAuthors "Dhia" --icon packaging/icon.ico --releaseNotes packaging/release-notes.md `
            --shortcuts StartMenuRoot --outputDir Releases
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed" }
          Get-ChildItem Releases

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-console-${{ github.sha }}
          path: |
            target/release/uc-agent.exe
            target/release/uc-settings.exe
            target/release/uc-probe.exe
          if-no-files-found: error
          retention-days: 14
