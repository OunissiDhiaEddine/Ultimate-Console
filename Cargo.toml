[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/OunissiDhiaEddine/Ultimate-Console"

# Every crate takes shared dependencies from here (`foo.workspace = true`) so
# parallel work packages stay on the same versions.
[workspace.dependencies]
uc-core = { path = "crates/uc-core" }
uc-display = { path = "crates/uc-display" }
uc-tv = { path = "crates/uc-tv" }
uc-shell = { path = "crates/uc-shell" }
uc-power = { path = "crates/uc-power" }
uc-audio = { path = "crates/uc-audio" }
uc-sysinfo = { path = "crates/uc-sysinfo" }
uc-overlay = { path = "crates/uc-overlay" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
clap = { version = "4.6", features = ["derive"] }
tempfile = "3"
# Win32 bindings for the platform crates. Add only the features you need in
# the crate's own Cargo.toml: `windows = { workspace = true, features = [...] }`.
windows = "0.62"
# Settings app UI (WP-09). 0.33 is the newest eframe that builds on the
# workspace MSRV (1.88). glow instead of wgpu keeps the exe small.
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "glow",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
